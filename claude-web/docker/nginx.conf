# claude-web : nginx 리버스 프록시 (Docker Compose 용)
#
# 공식 nginx 이미지의 /etc/nginx/conf.d/default.conf 를 이 파일로 덮어쓴다.
# (이미지의 nginx.conf 가 conf.d/*.conf 를 http 블록 안에서 include 한다)
#
#     브라우저 --80--> nginx 컨테이너 --8080--> app 컨테이너(gunicorn) --> Claude CLI
#
# 값의 근거
#   client_max_body_size 52m
#       app 의 MAX_CONTENT_LENGTH = MAX_UPLOAD_MB(10) * MAX_IMAGES_PER_MESSAGE(5)
#                                  * 1MiB + 1MiB = 51MiB
#       .env 에서 저 두 값을 올리면 여기도 같이 올려야 한다.
#       (여기가 작으면 nginx 가 413 을, 앱이 주는 한글 오류 메시지 대신 내보낸다)
#
#   proxy_read_timeout 360s
#       Claude timeout(관리자 > Claude 설정, 기본 180초)
#         < gunicorn timeout(deploy/gunicorn.conf.py, 기본 300초)
#         < nginx proxy_read_timeout(360초)
#       순서가 뒤집히면 앱이 만든 "시간 초과" 메시지가 아니라 502/504 가 뜬다.

# Docker 내장 DNS. app 컨테이너를 재생성하면 IP 가 바뀌므로 반드시 필요하다.
# (upstream 블록에 이름을 적으면 nginx 가 기동 시 한 번만 해석하고 캐시해서,
#  `docker compose up -d app` 뒤에 계속 502 가 난다)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    client_max_body_size 52m;
    client_body_timeout  120s;
    server_tokens        off;

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;

    # nginx 자체 상태 확인. app 을 거치지 않으므로 앱이 죽어도 200 이다.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # 변수를 써야 요청마다 resolver 로 다시 해석한다.
        set $upstream_app http://app:8080;
        proxy_pass $upstream_app$request_uri;

        proxy_http_version 1.1;
        # $host 가 아니라 $http_host 를 넘긴다. $host 는 포트를 떼어내므로
        # 80 이 아닌 포트로 서비스할 때 Flask/Werkzeug 가 만드는 절대 리다이렉트
        # (예: /admin -> http://HOST/admin/) 에서 포트가 사라져 접속이 끊긴다.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # keepalive 를 쓰려면 hop-by-hop 헤더를 비워야 한다.
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    360s;
        proxy_read_timeout    360s;

        # 업로드는 전부 받은 뒤 넘긴다. 워커가 1개라서 느린 업로드가 스레드를
        # 붙잡고 있지 않게 하는 편이 낫다.
        proxy_request_buffering on;
        proxy_buffering         on;
    }

    # /static/ 을 nginx 가 직접 서비스하지 않는 이유
    #   - 그러려면 소스 디렉터리를 nginx 컨테이너에도 마운트해야 한다.
    #   - /sw.js 와 /manifest.webmanifest 는 Flask 라우트다. sw.js 는
    #     Service-Worker-Allowed: / 헤더가 있어야 루트 스코프를 잡는다.
    #   - 사내 수십 명 규모에서 정적 파일 처리량은 문제가 되지 않는다.
    # 절대 하지 말 것: /api/attachments/ 를 alias 로 직접 서비스하는 것.
    #   첨부 접근 권한은 Flask 가 세션으로 검사한다. nginx 가 우회하면
    #   URL 만 아는 사람이 남의 private 세션 이미지를 받아갈 수 있다.
}
