<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 · chat-bot</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2328" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/type.css">
<link rel="stylesheet" href="/static/shared.css">
</head>
<body>
<div class="center-wrap">
  <form class="card" method="post" action="/login" autocomplete="on">
    <div class="brandmark" aria-hidden="true">C</div>
    <h1>chat-bot</h1>
    <p class="sub">사내 계정으로 로그인하세요.</p>

    {% if error %}
    <div class="alert error" role="alert">{{ error }}</div>
    {% endif %}

    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">

    <div class="field">
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" value="{{ username|default('') }}"
             autocomplete="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" required autofocus>
    </div>

    <div class="field">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>

    <button class="btn primary block" type="submit">로그인</button>

    <p class="sub" style="margin:16px 0 0; text-align:center;">
      계정이 필요하면 관리자에게 요청하세요.
    </p>
  </form>
</div>
</body>
</html>
