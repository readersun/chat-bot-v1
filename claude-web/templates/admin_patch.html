<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>패치 설정 · chat-bot</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2328" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/static/type.css">
<link rel="stylesheet" href="/static/rail.css">
<link rel="stylesheet" href="/static/shared.css">
<style>
/* =========================================================================
   패치 설정 (관리자)

   손으로 적는 것은 와칭 루트뿐이다. 사이트와 제품 라인은 스캔이 찾아 넣고
   여기서는 고르기만 한다. 그래서 두 묶음에는 "추가" 단추가 없다.
   ========================================================================= */
html, body { height: 100%; }
body { overflow: hidden; }

@media (min-width: 900px) {
  body {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
  }
}

.shell-main { min-width: 0; height: 100%; display: flex; flex-direction: column; }

#rail-toggle {
  flex: 0 0 auto; width: 40px; height: 40px; margin-left: -6px;
  border: 0; border-radius: var(--r-sm); background: transparent;
  color: var(--text); display: grid; place-items: center; cursor: pointer;
}
#rail-toggle:hover { background: var(--panel2); }
#rail-toggle svg {
  width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round; pointer-events: none;
}

#alerts:not(:empty) { padding: var(--s3) var(--s5) 0; }

#page {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: var(--s5);
  display: flex; flex-direction: column; gap: var(--s4);
}

.head { display: flex; align-items: baseline; gap: var(--s3); }
.head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.head .spacer { flex: 1 1 auto; }

.tabs { display: flex; gap: var(--s1); flex-wrap: wrap; }
.tabs button {
  min-height: 36px; padding: 0 var(--s4);
  border: 0; border-radius: var(--r-pill);
  background: transparent; color: var(--muted);
  font: inherit; font-size: 13.5px; cursor: pointer;
}
.tabs button.on { background: var(--accent-soft); color: var(--accent-press); font-weight: 600; }

.card {
  box-sizing: border-box;
  padding: var(--s4) var(--s5) var(--s3);
  border-radius: var(--r-lg);
  background: var(--panel);
  box-shadow: var(--sh-card);
}
.card + .card { margin-top: var(--s4); }
.card-head { display: flex; align-items: center; gap: var(--s3); padding-bottom: var(--s3); flex-wrap: wrap; }
.card-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.card-head .spacer { flex: 1 1 auto; }
.card-head .n { font-size: 12.5px; color: var(--muted); }

table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t caption {
  padding-bottom: var(--s2); text-align: left;
  font-size: 12.5px; color: var(--muted); text-wrap: balance;
}
table.t th {
  padding: 8px 10px 10px; text-align: left;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.right, table.t th.right { text-align: right; }
table.t td.center, table.t th.center { text-align: center; }
table.t td.num { font-variant-numeric: tabular-nums; }
table.t td.strong { font-weight: 600; }
.wrap-x { overflow-x: auto; }

.badge { display: inline-block; padding: 3px 10px; border-radius: var(--r-pill);
         font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
.badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
.badge.bad { background: var(--error-bg); color: var(--error-fg); }
.badge.mute { background: var(--panel2); color: var(--muted); }

.form-row { display: flex; gap: var(--s3); flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select { min-width: 140px; }
.field.grow { flex: 1 1 240px; }
.field.grow input { width: 100%; }

.hint { margin: var(--s3) 0 0; font-size: 12.5px; line-height: 1.8; color: var(--muted); text-wrap: balance; }
.box { box-sizing: border-box; padding: var(--s3) var(--s4); border-radius: var(--r); background: var(--panel2); }
.box.ok { background: var(--ok-bg); color: var(--ok-fg); }
.box.bad { background: var(--error-bg); color: var(--error-fg); }
.box.warn { background: var(--warn-bg); color: var(--warn-fg); }
.box p { margin: 0; font-size: 12.5px; line-height: 1.8; white-space: pre-wrap; }

.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
@media (min-width: 1100px) { .two { grid-template-columns: minmax(0, 1fr) 360px; } }

dl.kv { margin: 0; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

.empty { padding: var(--s5) var(--s4); border-radius: var(--r); background: var(--panel2);
         color: var(--muted); font-size: 13.5px; text-align: center; text-wrap: balance; }

.inline { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
code.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
</style>
</head>
<body>

{% include "_rail.html" %}

<div class="shell-main">

<header class="top">
  <button id="rail-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>
  </button>
  <span class="brand">{{ page_title }}</span>
  <span class="spacer"></span>
</header>

<div id="alerts" role="status" aria-live="polite"></div>

<div id="page">
  <div class="head"><h1>패치 설정</h1><span class="spacer"></span></div>
  <div class="tabs" id="tabs" role="group" aria-label="설정 묶음"></div>
  <div id="body"></div>
</div>

</div><!-- /.shell-main -->

<script src="/static/rail.js" defer></script>
<script>
(function () {
  "use strict";
  var CSRF = {{ csrf|tojson }};

  var TABS = [["roots", "와칭 루트"], ["sites", "사이트"], ["products", "제품 라인"],
              ["modules", "모듈"], ["files", "파일"], ["rules", "버전 규칙"],
              ["scan", "스캔"]];
  var state = { tab: "roots", data: null, productId: null, test: null, scans: [],
                unmatched: [], fileDate: null };

  /* ----------------------------------------------------------- 공통 */
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (k === "class") { n.className = props[k]; }
      else if (k === "text") { n.textContent = props[k]; }
      else if (k === "value") { n.value = props[k]; }
      else if (k === "checked") { n.checked = !!props[k]; }
      else if (k.slice(0, 2) === "on") { n[k] = props[k]; }
      else if (props[k] !== null && props[k] !== undefined) { n.setAttribute(k, props[k]); }
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined) { return; }
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function clear(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }

  function bytes(n) {
    if (n === null || n === undefined) { return "-"; }
    if (n < 1048576) { return (n / 1024).toFixed(1) + " KB"; }
    if (n < 1073741824) { return (n / 1048576).toFixed(1) + " MB"; }
    return (n / 1073741824).toFixed(2) + " GB";
  }

  function notify(msg, kind) {
    var box = document.getElementById("alerts");
    clear(box);
    box.appendChild(el("div", { class: "alert " + (kind || "info"), text: msg }));
    if (kind !== "error") { setTimeout(function () { clear(box); }, 4000); }
  }

  function api(method, url, body) {
    var opt = { method: method, headers: { "X-CSRF-Token": CSRF },
                credentials: "same-origin" };
    if (body !== undefined) {
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    return fetch(url, opt).then(function (res) {
      return res.json().catch(function () {
        return { ok: false, error: "서버 응답 해석 실패 (HTTP " + res.status + ")" };
      }).then(function (d) {
        if (!res.ok) { throw new Error((d && d.error) || ("HTTP " + res.status)); }
        return d;
      });
    });
  }

  function ago(stamp) {
    if (!stamp) { return "없음"; }
    var t = Date.parse(stamp.replace(" ", "T"));
    if (isNaN(t)) { return stamp; }
    var s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) { return "방금 전"; }
    if (s < 3600) { return Math.round(s / 60) + "분 전"; }
    if (s < 86400) { return Math.round(s / 3600) + "시간 전"; }
    return stamp.slice(5, 16);
  }

  /* 날짜 형식 고르는 칸. 목록에 없으면 직접 입력 칸이 함께 열린다. */
  function dateFormatPicker(value, onchange) {
    var presets = (state.data && state.data.date_presets) || [];
    var custom = presets.indexOf(value) < 0;
    var sel = el("select", { "aria-label": "날짜 형식" },
      presets.map(function (p) {
        return el("option", { value: p, text: p, selected: (!custom && p === value) ? "selected" : null });
      }).concat([el("option", { value: "__custom__", text: "직접 입력",
                                selected: custom ? "selected" : null })]));
    var box = el("input", { type: "text", value: custom ? value : "",
                            placeholder: "YYMMDD_prod", "aria-label": "날짜 형식 직접 입력",
                            title: "YYYY YY MM DD 는 숫자 자리, * 는 아무 글자나, "
                              + "그 밖의 글자는 글자 그대로입니다.",
                            style: "width:150px" });
    box.hidden = !custom;

    function fire() {
      var v = sel.value === "__custom__" ? box.value.trim() : sel.value;
      if (v) { onchange(v); }
    }
    sel.onchange = function () {
      box.hidden = sel.value !== "__custom__";
      if (sel.value === "__custom__") { box.focus(); } else { fire(); }
    };
    box.onchange = fire;
    return el("div", { class: "inline" }, [sel, box]);
  }

  function toggle(label, on, onchange) {
    var i = el("input", { type: "checkbox", checked: on, "aria-label": label });
    i.onchange = function () { onchange(i.checked); };
    return i;
  }

  function btn(text, kind, fn) {
    return el("button", { class: "btn " + (kind || "") + " sm", type: "button",
                          text: text, onclick: fn });
  }

  function reload(msg) {
    return api("GET", "/api/admin/patch/overview").then(function (d) {
      state.data = d;
      if (msg) { notify(msg); }
      render();
    }).catch(function (e) { notify(e.message, "error"); });
  }

  /* --------------------------------------------------------- 와칭 루트 */
  function viewRoots() {
    var d = state.data, box = el("div");

    var rows = d.roots.map(function (r) {
      var status = r.last_error
        ? el("span", { class: "badge bad", text: "읽을 수 없음" })
        : el("span", { class: "badge ok", text: r.scan_enabled ? "정상" : "검사 꺼짐" });
      return el("tr", {}, [
        el("td", { class: "strong" }, [el("code", { class: "mono", text: r.path })]),
        el("td", {}, [el("input", { type: "text", value: r.label || "",
                                    placeholder: "표시 이름", style: "width:120px",
                                    "aria-label": "표시 이름",
                                    onchange: function (e) {
                                      save(r.id, { label: e.target.value });
                                    } })]),
        el("td", {}, [el("input", { type: "number", value: r.scan_interval_s, min: "60",
                                    step: "60", style: "width:92px",
                                    "aria-label": "검사 주기(초)",
                                    onchange: function (e) {
                                      save(r.id, { scan_interval_s: parseInt(e.target.value, 10) || 600 });
                                    } })]),
        el("td", {}, [dateFormatPicker(r.date_format, function (v) {
          save(r.id, { date_format: v });
        })]),
        el("td", { class: "num", text: String(r.site_count) }),
        el("td", { text: ago(r.last_scanned_at) }),
        el("td", {}, [status]),
        el("td", { class: "right" }, [
          btn("경로 확인", "", function () { check(r.path); }),
          " ",
          btn("삭제", "danger", function () { removeRoot(r); })
        ])
      ]);
    });

    var table = el("table", { class: "t" }, [
      el("caption", { text: "손으로 적는 것은 이 표뿐입니다. 사이트와 제품 라인은 스캔이 찾아 넣습니다." }),
      el("thead", {}, [el("tr", {}, ["경로", "표시 이름", "주기(초)", "날짜 형식 기본값",
                                     "사이트", "마지막 검사", "상태", ""].map(function (h, i) {
        return el("th", { class: i === 7 ? "right" : "", text: h });
      }))]),
      el("tbody", {}, rows.length ? rows : [
        el("tr", {}, [el("td", { colspan: "8" }, [
          el("div", { class: "empty", text: "등록된 와칭 루트가 없습니다. 아래에서 추가하세요." })])])])
    ]);

    var card = el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [
        el("h2", { text: "와칭 루트" }),
        el("span", { class: "n", text: d.roots.length + "개" })
      ]),
      el("div", { class: "wrap-x" }, [table])
    ]);

    var bad = d.roots.filter(function (r) { return r.last_error; });
    if (bad.length) {
      card.appendChild(el("div", { class: "box bad", style: "margin-top:12px" },
        bad.map(function (r) { return el("p", { text: r.path + " — " + r.last_error }); })));
      card.appendChild(el("p", { class: "hint",
        text: "읽을 수 없는 루트는 그 루트만 멈춥니다. 나머지 루트는 평소대로 돌고, 색인도 지워지지 않습니다." }));
    }

    /* 추가 폼 */
    var pathIn = el("input", { type: "text", placeholder: d.base_dir + "/patch", style: "width:100%" });
    var labelIn = el("input", { type: "text", placeholder: "표시 이름 (선택)" });
    var fmt = { v: "YYMMDD" };
    var result = el("div", { class: "box", hidden: "hidden" });

    var addCard = el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [el("h2", { text: "루트 추가" })]),
      el("div", { class: "form-row" }, [
        el("label", { class: "field grow" }, [el("span", { text: "경로" }), pathIn]),
        el("label", { class: "field" }, [el("span", { text: "표시 이름" }), labelIn]),
        el("label", { class: "field" }, [el("span", { text: "날짜 형식" }),
          dateFormatPicker("YYMMDD", function (v) { fmt.v = v; })]),
        btn("경로 확인", "", function () { check(pathIn.value, result); }),
        el("button", { class: "btn primary", type: "button", text: "추가",
          onclick: function () {
            api("POST", "/api/admin/patch/roots",
                { path: pathIn.value, label: labelIn.value, date_format: fmt.v })
              .then(function () { pathIn.value = ""; labelIn.value = "";
                                  reload("루트를 등록했습니다. 검사를 돌리면 사이트가 보입니다."); })
              .catch(function (e) { notify(e.message, "error"); });
          } })
      ]),
      result,
      el("p", { class: "hint",
        text: "경로는 " + d.base_dir + " 아래에 있어야 합니다. 다운로드는 nginx 가 이 디렉터리 아래만 내보냅니다."
              + (d.xaccel ? "" : "  (지금은 개발 모드라 Flask 가 직접 내보냅니다)") })
    ]);

    box.appendChild(card);
    box.appendChild(addCard);
    return box;
  }

  function check(path, into) {
    api("POST", "/api/admin/patch/roots/check", { path: path }).then(function (d) {
      if (into) {
        into.hidden = false;
        into.className = "box " + (d.ok ? "ok" : "bad");
        clear(into);
        into.appendChild(el("p", { text: d.message }));
      } else {
        notify(d.message, d.ok ? "info" : "error");
      }
    }).catch(function (e) { notify(e.message, "error"); });
  }

  function save(id, patch) {
    api("PATCH", "/api/admin/patch/roots/" + id, patch)
      .then(function () { reload("저장했습니다."); })
      .catch(function (e) { notify(e.message, "error"); });
  }

  function removeRoot(r) {
    if (!window.confirm("와칭 루트 " + r.path + " 의 색인을 지웁니다.\n"
                        + "DAS 의 파일은 그대로 남습니다. 계속할까요?")) { return; }
    api("DELETE", "/api/admin/patch/roots/" + r.id)
      .then(function (d) { reload(d.note); })
      .catch(function (e) { notify(e.message, "error"); });
  }

  /* ----------------------------------------------------------- 사이트 */
  function viewSites() {
    var d = state.data;
    var rows = d.sites.map(function (s) {
      return el("tr", {}, [
        el("td", {}, [el("code", { class: "mono", text: s.root_path })]),
        el("td", { class: "strong", text: s.name }),
        el("td", {}, [el("input", { type: "text", value: s.label || "", placeholder: "표시 이름",
          style: "width:130px", "aria-label": s.name + " 표시 이름",
          onchange: function (e) { patchSite(s.id, { label: e.target.value }); } })]),
        el("td", { class: "num", text: String(s.product_count) }),
        el("td", {}, [dateFormatPicker(s.date_format, function (v) {
          patchSite(s.id, { date_format: v }, "날짜 형식을 바꿨습니다. 다시 검사하면 반영됩니다.");
        })]),
        el("td", { class: "center" }, [toggle(s.name + " 공개", s.is_visible, function (on) {
          patchSite(s.id, { is_visible: on });
        })])
      ]);
    });

    var hidden = d.sites.filter(function (s) { return !s.is_visible; }).length;
    return el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [
        el("h2", { text: "발견된 사이트" }),
        hidden ? el("span", { class: "badge warn", text: "숨김 " + hidden }) : null
      ]),
      el("div", { class: "wrap-x" }, [el("table", { class: "t" }, [
        el("caption", { text: "스캔이 찾아 넣습니다. 새로 발견된 것은 숨김으로 들어오고, 켜야 사용자에게 보입니다." }),
        el("thead", {}, [el("tr", {}, ["루트", "폴더 이름", "표시 이름", "제품 라인",
                                       "날짜 형식", "공개"].map(function (h, i) {
          return el("th", { class: i === 5 ? "center" : "", text: h });
        }))]),
        el("tbody", {}, rows.length ? rows : [el("tr", {}, [el("td", { colspan: "6" }, [
          el("div", { class: "empty", text: "아직 발견된 사이트가 없습니다. 스캔 묶음에서 검사를 돌려 보세요." })])])])
      ])]),
      el("p", { class: "hint",
        text: "날짜 형식은 루트의 기본값을 물려받습니다. 형식과 안 맞는 폴더도 버리지 않고 목록 맨 뒤에 남습니다." }),
      el("p", { class: "hint" }, [
        document.createTextNode("형식 쓰는 법 — "),
        el("code", { class: "mono", text: "YYYY YY MM DD" }),
        document.createTextNode(" 는 숫자 자리, "),
        el("code", { class: "mono", text: "*" }),
        document.createTextNode(" 는 아무 글자나(없어도 됩니다), 그 밖의 글자는 글자 그대로입니다. "),
        el("code", { class: "mono", text: "YYMMDD_prod" }),
        document.createTextNode(" 처럼 꼬리표를 그대로 적어도 되고, 폴더마다 꼬리표가 다르면 "),
        el("code", { class: "mono", text: "YYMMDD*" }),
        document.createTextNode(" 로 "),
        el("code", { class: "mono", text: "260923" }),
        document.createTextNode(" 와 "),
        el("code", { class: "mono", text: "260923_prod" }),

    function loadScans() {
      api("GET", "/api/admin/patch/scans").then(function (r) {
        clear(histBox);
        var rows = r.scans.map(function (s) {
          var result = s.error
            ? el("span", { class: "badge bad", text: s.error })
            : (s.held ? el("span", { class: "badge warn", text: "복사 중 " + s.held + "건 보류" })
                      : el("span", { class: "badge ok", text: "성공" }));
          return el("tr", {}, [
            el("td", { class: "num", text: (s.started_at || "").slice(5, 16) }),
            el("td", {}, [el("code", { class: "mono", text: s.root_path || "-" })]),
            el("td", { text: s.trigger_kind === "manual" ? "수동" : "주기" }),
            el("td", { class: "num right", text: String(s.added) }),
            el("td", { class: "num right", text: String(s.updated) }),
            el("td", { class: "num right", text: String(s.missing) }),
            el("td", { class: "num right", text: String(s.held) }),
            el("td", { class: "num right", text: String(s.unmatched) }),
            el("td", {}, [result])
          ]);
        });
        histBox.appendChild(el("table", { class: "t" }, [
          el("thead", {}, [el("tr", {}, ["시각", "루트", "방식", "추가", "갱신", "사라짐",
                                         "보류", "미매칭", "결과"].map(function (h, i) {
            return el("th", { class: (i >= 3 && i <= 7) ? "right" : "", text: h }); }))]),
          el("tbody", {}, rows.length ? rows : [el("tr", {}, [el("td", { colspan: "9" }, [
            el("div", { class: "empty", text: "아직 검사 기록이 없습니다." })])])])
        ]));
      }).catch(function (e) { notify(e.message, "error"); });
    }

    function loadUnmatched() {
      api("GET", "/api/admin/patch/unmatched").then(function (r) {
        clear(unBox);
        if (!r.files.length) {
          unBox.appendChild(el("div", { class: "empty",
            text: "매칭 안 된 파일이 없습니다. 모든 tar 가 등록된 모듈과 맞습니다." }));
          return;
        }
        /* 같은 제품 라인 안에서 같은 후보 이름끼리 묶는다. 한 모듈이 버전만
           여럿인 경우가 많아서, 줄마다 체크하면 같은 이름을 몇 번씩 누르게 된다. */
        var groups = {};
        r.files.forEach(function (f) {
          var key = f.product_id + "␀" + f.candidate;
          if (!groups[key]) {
            groups[key] = { product_id: f.product_id, candidate: f.candidate,
                            site: f.site_name, product: f.product_name, files: [] };
          }
          groups[key].files.push(f);
        });

        Object.keys(groups).forEach(function (k) {
          var g = groups[k];
          var nameIn = el("input", { type: "text", value: g.candidate, style: "width:180px",
                                     "aria-label": "등록할 모듈 이름" });
          unBox.appendChild(el("div", { class: "box", style: "margin-bottom:10px" }, [
            el("div", { class: "inline" }, [
              el("strong", { text: g.site + " / " + g.product }),
              el("span", { class: "n", text: g.files.length + "건" }),
              el("span", { class: "spacer", style: "flex:1 1 auto" }),
              nameIn,
              el("button", { class: "btn primary sm", type: "button", text: "모듈로 등록",
                onclick: function () {
                  api("POST", "/api/admin/patch/unmatched/register",
                      { product_id: g.product_id, names: [nameIn.value] })
                    .then(function (res) {
                      loadUnmatched(); loadScans();
                      reload("모듈 " + (res.registered.join(", ") || "-")
                             + " 을(를) 등록하고 다시 검사했습니다.");
                    }).catch(function (e) { notify(e.message, "error"); });
                } })
            ]),
            el("p", { style: "margin:8px 0 0;font-size:12px;color:var(--muted)",
                      text: g.files.slice(0, 4).map(function (f) { return f.filename; }).join("  ·  ")
                            + (g.files.length > 4 ? "  외 " + (g.files.length - 4) + "건" : "") })
          ]));
        });
      }).catch(function (e) { notify(e.message, "error"); });
    }

    var box = el("div", {}, [
      el("div", { class: "card" }, [
        el("div", { class: "card-head" }, [
          el("h2", { text: "검사" }),
          el("label", { class: "inline" }, [el("span", { class: "n", text: "루트" }), rootSel]),
          el("span", { class: "spacer" }),
          el("button", { class: "btn primary", type: "button", text: "지금 검사",
            onclick: function (e) {
              var b = e.target;
              b.disabled = true; b.textContent = "검사 중...";
              api("POST", "/api/admin/patch/scan",
                  rootSel.value ? { root_id: parseInt(rootSel.value, 10) } : {})
                .then(function (r) {
                  var add = 0, upd = 0, errs = [];
                  r.results.forEach(function (x) {
                    add += x.added; upd += x.updated;
                    if (x.error) { errs.push(x.error); }
                  });
                  loadScans(); loadUnmatched();
                  reload("검사 완료. 추가 " + add + "건, 갱신 " + upd + "건."
                         + (errs.length ? "  오류 " + errs.length + "건은 아래 기록을 보세요." : ""));
                })
                .catch(function (er) { notify(er.message, "error"); })
                .then(function () { b.disabled = false; b.textContent = "지금 검사"; });
            } })
        ]),
        el("p", { class: "hint", style: "margin-top:0",
          text: "한 번에 하나씩, 오래 안 돈 루트부터 순서대로 돕니다. 한 루트가 죽어도 나머지는 돕니다." })
      ]),
      el("div", { class: "card" }, [
        el("div", { class: "card-head" }, [el("h2", { text: "최근 검사" })]),
        histBox
      ]),
      el("div", { class: "card" }, [
        el("div", { class: "card-head" }, [el("h2", { text: "매칭 안 된 파일" })]),
        el("p", { class: "hint", style: "margin-top:0",
          text: "등록된 모듈과 맞지 않아 버전 관리에 들어가지 못한 tar 입니다. 새 모듈이 들어왔다는 신호입니다." }),
        unBox
      ])
    ]);

    loadScans();
    loadUnmatched();
    return box;
  }


  /* ------------------------------------------------------------- 파일
     tar 한 건을 끄는 곳. 묶음 단위(사이트/제품/모듈)로 끄는 것과 달리
     "묶음은 맞는데 이 파일만 아니다" 를 위한 자리다. 잘못 올라간 빌드,
     특정 고객사에만 나가야 하는 패치가 여기 걸린다.

     끄는 것은 색인의 칸 하나다. DAS 의 파일은 건드리지 않고, 다시 스캔해도
     꺼 둔 상태가 그대로 남는다. */
  function viewFiles() {
    var d = state.data;
    if (!d.products.length) {
      return el("div", { class: "card" }, [el("div", { class: "empty",
        text: "제품 라인이 아직 없습니다. 와칭 루트를 등록하고 검사를 돌려 보세요." })]);
    }
    if (!state.productId) { state.productId = d.products[0].id; }

    var dateBox = el("div", { class: "inline", style: "gap:6px" });
    var listBox = el("div", { class: "wrap-x" },
                     [el("div", { class: "empty", text: "불러오는 중..." })]);
    var toolBox = el("div", { class: "inline" });

    function save(url, body, msg) {
      return api("PATCH", url, body)
        .then(function () { load(); reload(msg); })
        .catch(function (e) { notify(e.message, "error"); });
    }

    function bulk(on, dateDir) {
      var what = dateDir ? ("날짜 " + dateDir + " 의 파일 전부") : "이 제품 라인의 파일 전부";
      if (!on && !window.confirm(what + "를 숨깁니다.\n"
          + "사용자 목록과 다운로드에서 사라집니다. DAS 의 파일은 그대로입니다.\n"
          + "나중에 같은 날짜로 새 파일이 들어오면 그 파일은 보이는 상태로 들어옵니다.\n"
          + "계속할까요?")) { return; }
      api("POST", "/api/admin/patch/files/visibility",
          { product_id: state.productId, date: dateDir || "", is_visible: on })
        .then(function (r) {
          load();
          reload((on ? "다시 보이게 했습니다: " : "숨겼습니다: ") + r.changed + "건");
        })
        .catch(function (e) { notify(e.message, "error"); });
    }

    function load() {
      var url = "/api/admin/patch/files?product_id=" + state.productId
              + (state.fileDate ? "&date=" + encodeURIComponent(state.fileDate) : "");
      api("GET", url).then(function (r) {
        state.fileDate = r.date || null;

        /* 날짜 고르는 줄 */
        clear(dateBox);
        if (!r.dates.length) {
          dateBox.appendChild(el("span", { class: "n", text: "날짜 폴더가 없습니다." }));
        }
        r.dates.forEach(function (dt) {
          var on = dt.date_dir === state.fileDate;
          var text = dt.date_dir + " (" + dt.count + ")";
          var b = el("button", {
            class: "btn sm " + (on ? "primary" : ""), type: "button",
            "aria-current": on ? "true" : null,
            title: dt.hidden ? ("숨긴 파일 " + dt.hidden + "건") : null,
            onclick: function () { state.fileDate = dt.date_dir; load(); }
          }, [document.createTextNode(text)]);
          if (dt.hidden) {
            b.appendChild(document.createTextNode(" "));
            b.appendChild(el("span", { class: "badge warn", text: "숨김 " + dt.hidden }));
          }
          dateBox.appendChild(b);
        });

        /* 날짜 통째로 */
        clear(toolBox);
        if (state.fileDate) {
          toolBox.appendChild(el("span", { class: "n", text: state.fileDate + " 통째로" }));
          toolBox.appendChild(btn("전부 숨기기", "danger", function () { bulk(false, state.fileDate); }));
          toolBox.appendChild(btn("전부 보이기", "", function () { bulk(true, state.fileDate); }));
        }

        /* 파일 표 */
        clear(listBox);
        var rows = r.files.map(function (f) {
          var marks = [];
          if (f.module === null) {
            marks.push(el("span", { class: "badge mute", text: "매칭 안 됨" }));
          } else if (f.module_visible === false) {
            marks.push(el("span", { class: "badge warn", text: "모듈 숨김" }));
          }
          if (f.is_missing) { marks.push(el("span", { class: "badge bad", text: "사라짐" })); }
          if (f.content_changed) { marks.push(el("span", { class: "badge warn", text: "내용 바뀜" })); }

          return el("tr", {}, [
            el("td", { class: "strong", text: f.module === null ? "-" : f.module }),
            el("td", { class: "num mono", text: f.version || "-" }),
            el("td", {}, [el("code", { class: "mono", text: f.filename })]),
            el("td", { class: "num right", text: bytes(f.size) }),
            el("td", {}, [el("div", { class: "inline" }, marks)]),
            el("td", { class: "center" }, [toggle(f.filename + " 공개", f.is_visible, function (on) {
              save("/api/admin/patch/files/" + f.id, { is_visible: on },
                   on ? "다시 보이게 했습니다." : "숨겼습니다.");
            })])
          ]);
        });

        listBox.appendChild(el("table", { class: "t" }, [
          el("caption", { text: "숨긴 것과 매칭 안 된 것까지 모두 나옵니다. 끈 것을 다시 찾을 수 있어야 하므로 거르지 않습니다." }),
          el("thead", {}, [el("tr", {}, ["모듈", "버전", "파일 이름", "크기", "상태", "공개"].map(
            function (h, i) {
              return el("th", { class: i === 3 ? "right" : (i === 5 ? "center" : ""), text: h });
            }))]),
          el("tbody", {}, rows.length ? rows : [el("tr", {}, [el("td", { colspan: "6" }, [
            el("div", { class: "empty",
              text: "이 날짜에 파일이 없습니다. 위에서 다른 날짜를 골라 보세요." })])])])
        ]));
      }).catch(function (e) { notify(e.message, "error"); });
    }

    var card = el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [
        el("h2", { text: "파일" }),
        el("label", { class: "inline" }, [
          el("span", { class: "n", text: "제품 라인" }),
          productSelect(function (id) { state.productId = id; state.fileDate = null; render(); })
        ]),
        el("span", { class: "spacer" }),
        toolBox
      ]),
      el("div", { class: "inline", style: "padding:0 0 12px" }, [dateBox]),
      listBox,
      el("p", { class: "hint",
        text: "공개를 끄면 사용자 목록과 다운로드에서 함께 사라집니다. 파일 주소를 알아도 받을 수 없습니다. "
          + "DAS 의 파일은 건드리지 않으므로 다시 켜면 그대로 돌아옵니다. "
          + "누가 무엇을 언제 숨겼는지는 감사 기록에 남습니다." })
    ]);

    load();
    return card;
  }

  /* ----------------------------------------------------------- 묶기 */
  function render() {
    var tabs = document.getElementById("tabs");
    clear(tabs);
    TABS.forEach(function (t) {
      tabs.appendChild(el("button", {
        class: state.tab === t[0] ? "on" : "", type: "button", text: t[1],
        "aria-current": state.tab === t[0] ? "true" : null,
        onclick: function () { state.tab = t[0]; render(); }
      }));
    });

    var body = document.getElementById("body");
    clear(body);
    if (!state.data) { body.appendChild(el("div", { class: "empty", text: "불러오는 중..." })); return; }

    var view = { roots: viewRoots, sites: viewSites, products: viewProducts,
                 modules: viewModules, files: viewFiles, rules: viewRules,
                 scan: viewScan }[state.tab];
    body.appendChild(view());
  }

  render();
  reload();
})();
</script>
</body>
</html>
