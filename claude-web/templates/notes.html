<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모 · chat-bot</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2328" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/type.css">
<link rel="stylesheet" href="/static/rail.css">
<link rel="stylesheet" href="/static/shared.css">
<style>
/* =========================================================================
   메모 화면
   데스크톱 : [목록 | 내용] 2단
   모바일   : 1단. 목록 -> 선택 -> 보기/수정 흐름으로 전환한다.
              (2단을 억지로 유지하면 좁은 화면에서 양쪽 다 못 쓰게 된다)

   목록은 표가 아니라 둥근 카드 행이다. 예전에는 왼쪽에 회색 판을 깔고
   세로 구분선을 그었다. 선을 지우고 카드가 스스로 떠 있게 한다.
   색과 모서리와 그림자 값은 shared.css 의 토큰을 그대로 쓴다.
   ========================================================================= */
html, body { height: 100%; }
body { overflow: hidden; }

@media (min-width: 900px) {
  body {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    /* 행도 화면 높이에 묶는다.
       열만 지정하면 행은 auto 라서 내용이 길어지는 만큼 늘어난다. 그러면
       .shell-main -> #wrap -> #view-pane 이 줄줄이 내용 높이가 되어
       어디에서도 넘치지 않고, body 의 overflow:hidden 때문에 그냥 잘려 보인다.
       긴 메모가 스크롤되지 않던 원인이 이것이었다. */
    grid-template-rows: minmax(0, 1fr);
  }
}

.shell-main {
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* 좁은 화면에서 왼쪽 레일 서랍을 여는 단추 */
#rail-toggle {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  margin-left: -6px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text);
  display: grid;
  place-items: center;
  cursor: pointer;
}
#rail-toggle:hover { background: var(--panel2); }
#rail-toggle svg {
  width: 18px; height: 18px;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
  pointer-events: none;
}



/* 알림은 #wrap 밖에 있다. 좌우 여백을 여기서 준다 */
#alerts:not(:empty) { padding: var(--s3) var(--s5) 0; }

#wrap {
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr);
  /* 행 높이를 화면에 묶는다.
     이 줄이 없으면 행이 auto 라서 내용이 길어지는 만큼 같이 늘어난다.
     그러면 안쪽 #list 와 #view-pane 의 높이가 "내용 높이" 와 같아져
     넘칠 일이 없어지고, overflow-y:auto 를 걸어 두어도 스크롤이 생기지 않는다.
     body 가 overflow:hidden 이므로 긴 메모는 그냥 잘려 보였다. */
  grid-template-rows: minmax(0, 1fr);
  gap: var(--s4);
  flex: 1 1 auto;
  min-height: 0;
  padding: var(--s4) max(var(--s5), var(--sa-right)) var(--s4) max(var(--s5), var(--sa-left));
}

/* ---------------------------------------------------------------- 목록 */
/* 판을 깔지 않는다. 카드 행 자체가 층이다 */
#list-pane {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 0;
  background: transparent;
}

.pane-head {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: 0 var(--s1) var(--s3);
}
.pane-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.005em; }
.pane-head .spacer { flex: 1; }

.pane-tools { padding: 0 var(--s1) var(--s3); display: grid; gap: var(--s2); }

.chips { display: flex; gap: var(--s1); }
.chip {
  flex: 1;
  min-height: 34px;
  padding: 0 var(--s2);
  border: 0;
  border-radius: var(--r-pill);
  background: var(--panel);
  color: var(--muted);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .14s ease, color .14s ease;
}
.chip:hover { color: var(--text); }
.chip.active { background: var(--accent); color: var(--on-accent); }

#search {
  width: 100%;
  min-height: 40px;
  padding: 0 var(--s4);
  border: 0;
  border-radius: var(--r);
  background: var(--panel);
  color: var(--text);
  font: inherit;
}
#search:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
#search::placeholder { color: var(--muted); }

#list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px var(--s1) var(--s4); }

/* 메모 한 건 = 카드 한 장. 테두리를 두르지 않고 그림자로만 띄운다 */
.item {
  width: 100%;
  display: block;
  text-align: left;
  padding: var(--s3) var(--s4);
  margin-bottom: var(--s2);
  border: 0;
  border-radius: var(--r);
  background: var(--panel);
  box-shadow: var(--sh-card);
  color: inherit;
  font: inherit;
  cursor: pointer;
  transition: background-color .14s ease, transform .14s ease;
}
.item:hover { background: var(--panel2); }
.item.active {
  background: var(--accent-soft);
  color: var(--accent-press);
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  .item, .chip { transition: none; }
}

.item .line1 { display: flex; align-items: center; gap: var(--s1); }
.item .vis {
  flex: none;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.item.active .vis { color: var(--accent-press); }
.item .vis svg, .item .clip svg, .badge svg, .radios label svg {
  width: 14px;
  height: 14px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.item .name {
  flex: 1;
  min-width: 0;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item .clip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 12px;
  color: var(--muted);
}
.item .line2 {
  margin-top: 1px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item.active .line2, .item.active .clip { color: var(--accent-press); opacity: .85; }

.empty {
  padding: 40px var(--s4);
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.75;
  text-align: center;
}

/* ---------------------------------------------------------------- 본문 */
/* 오른쪽은 흰 판 한 장이다. 판 안에서만 스크롤한다 */
#view-pane {
  min-width: 0;
  overflow-y: auto;
  padding: var(--s6) 28px 40px;
  background: var(--panel);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-card);
}

#back-btn { display: none; }

.note-head { display: flex; align-items: flex-start; gap: var(--s3); flex-wrap: wrap; }
.note-head h2 {
  margin: 0;
  flex: 1;
  min-width: 200px;
  font-size: 24px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -.005em;
  overflow-wrap: anywhere;
}
.note-meta { margin: var(--s2) 0 var(--s5); font-size: 13px; line-height: 1.7; color: var(--muted); }

/* 줄바꿈이 그대로 보여야 한다. rich text editor 는 쓰지 않는다.
   본문 위에 선을 긋지 않는다. 위쪽 여백이 그 일을 한다. */
.note-body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 15px;
  line-height: 1.85;
  padding: var(--s3) 0 var(--s2);
  border-top: 0;
}
.note-body.blank { color: var(--muted); }

/* ------------------------------------------------------------ 첨부파일 */
.att-list { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }

.att {
  display: flex;
  align-items: center;
  gap: var(--s3);
  max-width: 100%;
  padding: var(--s2) var(--s3);
  border: 0;
  border-radius: var(--r);
  background: var(--panel2);
}
.att img {
  width: 46px;
  height: 46px;
  object-fit: cover;
  border-radius: var(--r-sm);
  flex: none;
  background: var(--code-bg);
}
.att .ico {
  width: 46px;
  height: 46px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  background: var(--panel);
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}
.att .info { min-width: 0; }
.att .fname {
  display: block;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--accent);
}
.att .fsize { font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.att .del {
  flex: none;
  min-height: 32px;
  padding: 0 var(--s3);
  border: 0;
  border-radius: var(--r-sm);
  background: var(--error-bg);
  color: var(--danger);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}
.att .del:hover { background: var(--danger); color: var(--on-danger); }

/* ------------------------------------------------------------------ 폼 */
.form-field { margin-bottom: var(--s4); }
.form-field > label {
  display: block;
  margin-bottom: 7px;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.6;
  color: var(--muted);
}
.form-field input[type="text"], .form-field textarea {
  width: 100%;
  padding: 12px 15px;
  border: 0;
  border-radius: var(--r-sm);
  background: var(--panel2);
  color: var(--text);
  font: inherit;
}
.form-field textarea {
  min-height: 280px;
  resize: vertical;
  line-height: 1.85;
  border-radius: var(--r);
  padding: var(--s4);
}
.form-field input[type="text"]:focus, .form-field textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  background: var(--panel);
}

/* 공개범위 선택. 동그라미 두 개를 나란히 두는 대신 누를 수 있는 면으로 넓힌다 */
.radios { display: flex; gap: var(--s2); flex-wrap: wrap; }
.radios label {
  display: flex;
  align-items: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 0 var(--s4);
  border-radius: var(--r);
  background: var(--panel2);
  font-size: 14px;
  cursor: pointer;
}
.radios input { width: 18px; height: 18px; accent-color: var(--accent); }

.picked { margin-top: var(--s2); font-size: 13px; line-height: 1.7; color: var(--muted); }
.picked div { overflow-wrap: anywhere; }

/* 저장과 취소 위에 선을 긋지 않는다. 여백으로 끊는다 */
.form-actions {
  display: flex;
  gap: var(--s2);
  flex-wrap: wrap;
  padding-top: var(--s4);
  border-top: 0;
}
.form-actions .spacer { flex: 1; }


/* ---------------------------------------------------------------- 댓글 */
.cmt-wrap { margin-top: 28px; }

.cmt-head {
  display: flex;
  align-items: baseline;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.cmt-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.cmt-head .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.cmt-list { display: flex; flex-direction: column; gap: var(--s2); }

/* 댓글 한 건. 테두리 대신 오목한 면으로 둔다 */
.cmt {
  background: var(--panel2);
  border-radius: var(--r);
  padding: var(--s3) var(--s4);
}

/* 답글은 한 단계만 들어간다. 왼쪽에 선을 긋지 않고 여백과 바탕색으로 구분한다 */
.cmt-replies {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  margin: var(--s2) 0 0 24px;
}
.cmt-replies .cmt { background: var(--panel); box-shadow: var(--sh-card); }

.cmt-top {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: 5px;
}

.cmt-av {
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: var(--r-pill);
  background: var(--track);
  color: var(--text);
  display: grid;
  place-items: center;
  font-size: 11.5px;
  font-weight: 600;
}
.cmt-who { font-size: 13.5px; font-weight: 600; }
.cmt-when { font-size: 12px; color: var(--muted); }
.cmt-acts { margin-left: auto; display: flex; gap: 2px; }

.cmt-acts button {
  min-height: 30px;
  padding: 0 var(--s2);
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
}
.cmt-acts button:hover { background: var(--accent-soft); color: var(--accent-press); }
.cmt-acts button.danger:hover { background: var(--error-bg); color: var(--danger); }

/* 줄바꿈을 그대로 보여준다. 메모 본문과 같은 규칙이다 */
.cmt-body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.8;
}

.cmt-form { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s3); }
.cmt-form.reply { margin: var(--s2) 0 0 24px; }

.cmt-form textarea {
  width: 100%;
  min-height: 84px;
  padding: var(--s3) var(--s4);
  border: 0;
  border-radius: var(--r);
  background: var(--panel2);
  color: var(--text);
  font: inherit;
  font-size: 14px;
  line-height: 1.8;
  resize: vertical;
}
.cmt-form textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  background: var(--panel);
}
.cmt-form .row { justify-content: flex-end; }
.cmt-form .count { margin-right: auto; font-size: 12px; color: var(--muted); }

.cmt-empty {
  padding: var(--s5) var(--s4);
  border-radius: var(--r);
  background: var(--panel2);
  color: var(--muted);
  font-size: 13.5px;
  text-align: center;
}

@media (pointer: coarse) {
  .cmt-acts button { min-height: var(--tap); padding: 0 var(--s3); }
}

/* 손가락으로 누르는 기기에서는 조작 요소를 44px 이상으로 키운다 */
@media (pointer: coarse) {
  .chip { min-height: var(--tap); }
  #search { min-height: var(--tap); }
  .att .del { min-height: var(--tap); }
}

/* ------------------------------------------------------------- 모바일 */
@media (max-width: 860px) {
  #wrap {
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
    padding: var(--s3) var(--s3) 0;
  }
  #list-pane { border-right: 0; }
  #view-pane { display: none; padding: var(--s5) var(--s5) 40px; }

  /* 상세를 보는 중에는 목록을 감추고 본문만 보여준다 */
  body.detail #list-pane { display: none; }
  body.detail #view-pane { display: block; }

  #back-btn { display: inline-flex; }
  .att .fname { max-width: 150px; }
  .form-field textarea { min-height: 220px; }
  #alerts:not(:empty) { padding: var(--s3) var(--s3) 0; }
}

@media (max-width: 600px) {
  #wrap { padding: var(--s2) var(--s2) 0; }
  #view-pane { padding: var(--s4) var(--s4) 40px; }
  .note-head h2 { font-size: 21px; }
}
</style>
</head>
<body>

{% include "_rail.html" %}

<div class="shell-main">

<header class="top">
  <button id="rail-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>
  </button>
  <span class="brand">메모</span>
  <span class="spacer"></span>
</header>

<div id="alerts" role="status" aria-live="polite"></div>

<div id="wrap">
  <aside id="list-pane">
    <div class="pane-head">
      <h1>메모</h1>
      <span class="spacer"></span>
      <button class="btn primary sm" type="button" id="new-btn">+ 새 메모</button>
    </div>
    <div class="pane-tools">
      <div class="chips" role="group" aria-label="메모 필터">
        <button type="button" class="chip active" data-scope="all">전체</button>
        <button type="button" class="chip" data-scope="mine">내 메모</button>
        <button type="button" class="chip" data-scope="shared">공유 메모</button>
      </div>
      <input type="search" id="search" placeholder="제목 검색..."
             aria-label="메모 제목 검색" autocomplete="off">
    </div>
    <div id="list"></div>
  </aside>

  <main id="view-pane" aria-live="polite"></main>
</div>

</div><!-- /.shell-main -->

<script src="/static/rail.js" defer></script>

<script>
(function () {
  "use strict";

  var ME = {{ me|tojson }};
  var CSRF = {{ csrf|tojson }};
  var LIMITS = {{ limits|tojson }};

  /* 그림 문자(이모지) 대신 선으로 그린 아이콘을 쓴다.
     이모지는 기기와 글꼴마다 모양과 색이 달라서, 한 화면 안에서 혼자 튄다.
     자물쇠 = 나만 보기, 지구 = 전체 공개, 클립 = 첨부파일. */
  var SVG_NS = "http://www.w3.org/2000/svg";

  function svgIcon(shapes) {
    var s = document.createElementNS(SVG_NS, "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("aria-hidden", "true");
    shapes.forEach(function (d) {
      var node = document.createElementNS(SVG_NS, d[0]);
      Object.keys(d[1]).forEach(function (k) { node.setAttribute(k, d[1][k]); });
      s.appendChild(node);
    });
    return s;
  }

  var ICON_LOCK = [["rect", { x: "5", y: "11", width: "14", height: "9", rx: "3" }],
                   ["path", { d: "M8 11V8a4 4 0 0 1 8 0v3" }]];
  var ICON_GLOBE = [["circle", { cx: "12", cy: "12", r: "9" }],
                    ["path", { d: "M3 12h18" }],
                    ["path", { d: "M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18" }]];
  var ICON_CLIP = [["path", { d: "M20 11.5l-8 8a5 5 0 0 1-7-7l8-8a3.3 3.3 0 0 1 4.7 4.7"
                                 + "l-8 8a1.7 1.7 0 0 1-2.4-2.4l7.2-7.2" }]];

  function visIcon(isPublic) { return svgIcon(isPublic ? ICON_GLOBE : ICON_LOCK); }


  var listBox = document.getElementById("list");
  var viewBox = document.getElementById("view-pane");
  var alerts = document.getElementById("alerts");
  var searchInput = document.getElementById("search");

  var state = { scope: "all", q: "", notes: [], current: null, editing: false,
                comments: [] };

  /* --------------------------------------------------------- DOM 헬퍼
     textContent 만 쓴다. innerHTML 은 어디에서도 쓰지 않는다.
     (메모 제목/내용/파일명이 그대로 HTML 로 해석되면 안 된다) */
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      if (k === "class") { n.className = props[k]; }
      else if (k === "text") { n.textContent = props[k]; }
      else if (k.slice(0, 2) === "on") { n[k] = props[k]; }
      else if (props[k] !== null && props[k] !== undefined) { n.setAttribute(k, props[k]); }
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined) { return; }
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  function bytes(n) {
    if (!n && n !== 0) { return "-"; }
    if (n < 1024) { return n + " B"; }
    if (n < 1048576) { return (n / 1024).toFixed(1) + " KB"; }
    return (n / 1048576).toFixed(1) + " MB";
  }

  function notify(msg, kind) {
    var box = el("div", { class: "alert " + (kind || "ok"), role: "alert", text: msg });
    alerts.appendChild(box);
    setTimeout(function () {
      if (box.parentNode) { box.parentNode.removeChild(box); }
    }, 6000);
  }

  /* ------------------------------------------------------------- 모달 */
  function confirmBox(opts) {
    return new Promise(function (resolve) {
      var ov = el("div", { class: "overlay" });
      var box = el("div", { class: "modal", role: "dialog", "aria-modal": "true" });
      box.appendChild(el("h3", { text: opts.title }));
      if (opts.message) { box.appendChild(el("p", { text: opts.message })); }

      var cancel = el("button", { class: "btn", type: "button", text: "취소" });
      var ok = el("button", {
        class: "btn " + (opts.danger ? "danger" : "primary"),
        type: "button", text: opts.confirmText || "확인"
      });
      box.appendChild(el("div", { class: "actions" }, [cancel, ok]));

      function done(v) {
        document.removeEventListener("keydown", onKey);
        if (ov.parentNode) { ov.parentNode.removeChild(ov); }
        resolve(v);
      }
      function onKey(e) { if (e.key === "Escape") { done(false); } }
      cancel.onclick = function () { done(false); };
      ok.onclick = function () { done(true); };
      ov.onclick = function (e) { if (e.target === ov) { done(false); } };

      document.addEventListener("keydown", onKey);
      ov.appendChild(box);
      document.body.appendChild(ov);
      ok.focus();
    });
  }

  /* --------------------------------------------------------------- API */
  function api(method, url, body) {
    var opt = { method: method, headers: { "X-CSRF-Token": CSRF },
                credentials: "same-origin" };
    if (body instanceof FormData) {
      opt.body = body;                      /* Content-Type 은 브라우저가 붙인다 */
    } else if (body !== undefined) {
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    return fetch(url, opt).then(function (res) {
      if (res.status === 413) {
        throw new Error("업로드 용량이 서버 허용치를 넘었습니다. (파일당 최대 "
                        + LIMITS.max_note_attachment_mb + "MB)");
      }
      return res.json().catch(function () {
        return { ok: false, error: "서버 응답 해석 실패 (HTTP " + res.status + ")" };
      }).then(function (data) {
        if (!res.ok) { throw new Error((data && data.error) || ("HTTP " + res.status)); }
        return data;
      });
    });
  }

  /* -------------------------------------------------------- 모바일 전환 */
  function showDetail(on) {
    if (on) { document.body.classList.add("detail"); }
    else { document.body.classList.remove("detail"); }
  }

  function backButton() {
    return el("button", {
      class: "btn sm", type: "button", id: "back-btn", text: "← 목록",
      onclick: function () { showDetail(false); }
    });
  }

  /* ---------------------------------------------------------- 목록 렌더 */
  function loadList(keepCurrent) {
    var url = "/api/notes?scope=" + encodeURIComponent(state.scope);
    if (state.q) { url += "&q=" + encodeURIComponent(state.q); }
    return api("GET", url).then(function (d) {
      state.notes = d.notes || [];
      renderList();
      if (!keepCurrent) { return null; }
      /* 목록을 새로 불러와도 열려 있던 메모는 그대로 유지한다 */
      return null;
    });
  }

  function renderList() {
    clear(listBox);
    if (!state.notes.length) {
      listBox.appendChild(el("div", { class: "empty", text:
        state.q ? "검색 결과가 없습니다." :
        state.scope === "shared" ? "공유된 메모가 없습니다."
                                 : "메모가 없습니다. [+ 새 메모] 를 눌러 시작하세요." }));
      return;
    }
    state.notes.forEach(function (n) {
      var isPub = n.visibility === "public";
      var sub = [];
      if (!n.is_owner && n.owner_name) { sub.push(n.owner_name); }
      else if (!n.is_owner) { sub.push("(소유자 없음)"); }
      if (n.preview) { sub.push(n.preview); }

      var btn = el("button", {
        class: "item" + (state.current && state.current.id === n.id ? " active" : ""),
        type: "button",
        onclick: function () { open(n.id); }
      }, [
        el("div", { class: "line1" }, [
          el("span", { class: "vis", title: isPub ? "전체 공유" : "나만 보기" },
             [visIcon(isPub)]),
          el("span", { class: "name", text: n.title || "(제목 없음)" }),
          n.attachment_count
            ? el("span", { class: "clip", title: "첨부파일" },
                 [svgIcon(ICON_CLIP), String(n.attachment_count)])
            : null
        ]),
        el("div", { class: "line2", text: sub.join(" · ") || n.updated_at })
      ]);
      listBox.appendChild(btn);
    });
  }


  /* ------------------------------------------------------------- 댓글 */
  /* 서버가 돌려준 트리를 그대로 그린다. 깊이는 한 단계뿐이다.
     (답글에 답글은 서버에서 막는다) */

  function cmtTime(c) {
    var t = c.created_at || "";
    return c.updated_at && c.updated_at !== c.created_at ? t + " (고침)" : t;
  }

  function commentNode(note, c) {
    var box = el("div", { class: "cmt" });

    var acts = el("div", { class: "cmt-acts" });
    /* 답글은 부모 댓글에만 단다 */
    if (!c.parent_id) {
      acts.appendChild(el("button", { type: "button", text: "답글",
        onclick: function () { toggleReplyForm(note, c, box); } }));
    }
    if (c.can_edit) {
      acts.appendChild(el("button", { type: "button", text: "수정",
        onclick: function () { startEditComment(note, c, box); } }));
    }
    if (c.can_delete) {
      acts.appendChild(el("button", { class: "danger", type: "button", text: "삭제",
        onclick: function () { removeComment(note, c); } }));
    }

    var name = c.author_name || "(탈퇴한 사용자)";
    box.appendChild(el("div", { class: "cmt-top" }, [
      el("span", { class: "cmt-av", "aria-hidden": "true",
                   text: name.slice(0, 1).toUpperCase() }),
      el("span", { class: "cmt-who", text: c.is_mine ? "나" : name }),
      el("span", { class: "cmt-when", text: cmtTime(c) }),
      acts
    ]));
    box.appendChild(el("div", { class: "cmt-body", text: c.content }));

    var wrap = el("div", {}, [box]);
    if (c.replies && c.replies.length) {
      wrap.appendChild(el("div", { class: "cmt-replies" },
        c.replies.map(function (r) { return commentNode(note, r); })));
    }
    return wrap;
  }

  /* 글자 수를 세어 보여주는 입력칸. 새 댓글 / 답글 / 수정이 모두 쓴다. */
  function commentForm(opts) {
    var ta = el("textarea", {
      placeholder: opts.placeholder || "댓글을 입력하세요",
      "aria-label": opts.placeholder || "댓글"
    });
    ta.value = opts.value || "";

    var count = el("span", { class: "count" });
    function sync() {
      var max = (LIMITS && LIMITS.max_comment_chars) || 2000;
      count.textContent = ta.value.length + " / " + max;
    }
    ta.oninput = sync;
    sync();

    var submit = el("button", { class: "btn primary sm", type: "button",
                                text: opts.submitText || "등록" });
    var kids = [count];
    if (opts.onCancel) {
      kids.push(el("button", { class: "btn sm", type: "button", text: "취소",
                               onclick: opts.onCancel }));
    }
    kids.push(submit);

    submit.onclick = function () {
      var text = ta.value.trim();
      if (!text) { notify("내용을 입력해 주세요.", "error"); ta.focus(); return; }
      submit.disabled = true;
      opts.onSubmit(text, function () { submit.disabled = false; });
    };

    var form = el("div", { class: "cmt-form" + (opts.reply ? " reply" : "") },
                  [ta, el("div", { class: "row" }, kids)]);
    form.focusInput = function () { ta.focus(); };
    return form;
  }

  function applyComments(note, list) {
    state.comments = list;
    renderView();
  }

  function addComment(note, text, parentId, done) {
    api("POST", "/api/notes/" + note.id + "/comments",
        { content: text, parent_id: parentId || null })
      .then(function (d) {
        notify(parentId ? "답글을 남겼습니다." : "댓글을 남겼습니다.");
        applyComments(note, d.comments);
      })
      .catch(function (e) { notify(e.message, "error"); if (done) done(); });
  }

  function toggleReplyForm(note, c, box) {
    var open = box.parentNode.querySelector(".cmt-form.reply");
    if (open) { open.parentNode.removeChild(open); return; }
    var form = commentForm({
      reply: true,
      placeholder: (c.author_name || "") + " 님에게 답글",
      submitText: "답글 등록",
      onCancel: function () { if (form.parentNode) form.parentNode.removeChild(form); },
      onSubmit: function (text, done) { addComment(note, text, c.id, done); }
    });
    box.parentNode.appendChild(form);
    form.focusInput();
  }

  function startEditComment(note, c, box) {
    if (box.querySelector(".cmt-form")) { return; }
    var body = box.querySelector(".cmt-body");
    body.hidden = true;
    var form = commentForm({
      value: c.content,
      submitText: "저장",
      onCancel: function () { body.hidden = false; box.removeChild(form); },
      onSubmit: function (text, done) {
        api("PATCH", "/api/note-comments/" + c.id, { content: text })
          .then(function (d) { notify("댓글을 고쳤습니다."); applyComments(note, d.comments); })
          .catch(function (e) { notify(e.message, "error"); done(); });
      }
    });
    box.appendChild(form);
    form.focusInput();
  }

  function removeComment(note, c) {
    var n = (c.replies || []).length;
    confirmBox({
      title: "댓글 삭제",
      message: n ? "이 댓글과 답글 " + n + "개를 함께 지웁니다. 되돌릴 수 없습니다."
                 : "이 댓글을 지웁니다. 되돌릴 수 없습니다.",
      confirmText: "삭제", danger: true
    }).then(function (yes) {
      if (!yes) { return null; }
      return api("DELETE", "/api/note-comments/" + c.id)
        .then(function (d) { notify("댓글을 지웠습니다."); applyComments(note, d.comments); });
    }).catch(function (e) { notify(e.message, "error"); });
  }

  /* 보기 화면 맨 아래에 붙는 댓글 묶음 */
  function commentsSection(note) {
    var list = state.comments || [];
    var total = list.reduce(function (acc, c) {
      return acc + 1 + ((c.replies && c.replies.length) || 0);
    }, 0);

    var wrap = el("div", { class: "cmt-wrap" }, [
      el("div", { class: "cmt-head" }, [
        el("h3", { text: "댓글" }),
        el("span", { class: "n", text: String(total) })
      ])
    ]);

    if (list.length) {
      wrap.appendChild(el("div", { class: "cmt-list" },
        list.map(function (c) { return commentNode(note, c); })));
    } else {
      wrap.appendChild(el("div", { class: "cmt-empty",
        text: "아직 댓글이 없습니다. 첫 댓글을 남겨 보세요." }));
    }

    wrap.appendChild(commentForm({
      onSubmit: function (text, done) { addComment(note, text, null, done); }
    }));
    return wrap;
  }

  /* ---------------------------------------------------------- 보기 화면 */
  function open(id) {
    /* 메모와 댓글을 함께 받는다. 따로 받으면 화면이 두 번 그려지면서
       댓글 자리가 잠깐 비었다가 나타난다. */
    return Promise.all([
      api("GET", "/api/notes/" + id),
      api("GET", "/api/notes/" + id + "/comments")
    ]).then(function (r) {
      state.current = r[0].note;
      state.comments = r[1].comments;
      state.editing = false;
      renderView();
      renderList();
      showDetail(true);
    }).catch(function (e) {
      notify(e.message, "error");
      state.current = null; state.comments = [];
      state.comments = [];
      loadList();
    });
  }

  function attachmentNode(a, canDelete) {
    var isImg = a.mime_type.indexOf("image/") === 0;
    var url = "/api/note-attachments/" + a.id;
    var thumb = isImg
      ? el("img", { src: url, alt: a.original_name, loading: "lazy" })
      : el("span", { class: "ico", text: a.mime_type === "application/pdf" ? "PDF" : "TXT" });

    var link = el("a", { class: "fname", href: url, target: "_blank",
                         rel: "noopener", text: a.original_name });

    var kids = [
      thumb,
      el("div", { class: "info" }, [link, el("div", { class: "fsize", text: bytes(a.file_size) })])
    ];
    if (canDelete) {
      kids.push(el("button", {
        class: "del", type: "button", text: "삭제",
        onclick: function () { removeAttachment(a); }
      }));
    }
    return el("div", { class: "att" }, kids);
  }

  function renderView() {
    var n = state.current;
    clear(viewBox);
    if (!n) {
      viewBox.appendChild(el("div", { class: "empty",
        text: "왼쪽에서 메모를 선택하거나 새 메모를 만드세요." }));
      return;
    }

    var isPub = n.visibility === "public";
    var head = el("div", { class: "note-head" }, [
      backButton(),
      el("h2", { text: n.title || "(제목 없음)" }),
      el("span", { class: "badge " + (isPub ? "warn" : "ok") },
         [visIcon(isPub), isPub ? "전체 공유" : "나만 보기"])
    ]);
    viewBox.appendChild(head);

    var who = n.is_owner ? "나" : (n.owner_name || "(소유자 없음)");
    viewBox.appendChild(el("div", { class: "note-meta",
      text: "작성자 " + who + " · 수정 " + n.updated_at + " · 작성 " + n.created_at }));

    if (n.can_manage) {
      viewBox.appendChild(el("div", { class: "row", style: "margin-bottom:14px" }, [
        el("button", { class: "btn sm", type: "button", text: "수정",
          onclick: function () { state.editing = true; renderForm(n); } }),
        el("button", { class: "btn sm danger", type: "button", text: "삭제",
          onclick: function () { removeNote(n); } })
      ]));
    } else {
      viewBox.appendChild(el("div", { class: "muted", style: "margin-bottom:14px;font-size:13px",
        text: "공유된 메모입니다. 읽기만 가능합니다." }));
    }

    viewBox.appendChild(el("div", {
      class: "note-body" + (n.content ? "" : " blank"),
      text: n.content || "(내용 없음)"
    }));

    if (n.attachments && n.attachments.length) {
      viewBox.appendChild(el("h3", { style: "margin:18px 0 0;font-size:14px",
                                     text: "첨부파일 (" + n.attachments.length + ")" }));
      viewBox.appendChild(el("div", { class: "att-list" },
        n.attachments.map(function (a) { return attachmentNode(a, false); })));
    }

    viewBox.appendChild(commentsSection(n));
  }

  /* -------------------------------------------------------- 작성/수정 폼 */
  function renderForm(n) {
    var isNew = !n;
    clear(viewBox);
    showDetail(true);

    var title = el("input", { type: "text", maxlength: LIMITS.max_title_chars,
                              value: isNew ? "" : (n.title || ""),
                              placeholder: "예: 서버 점검 내용" });
    var content = el("textarea", { placeholder: "내용을 입력하세요. 줄바꿈은 그대로 저장됩니다.",
                                   maxlength: LIMITS.max_content_chars });
    content.value = isNew ? "" : (n.content || "");

    var vis = isNew ? "private" : n.visibility;
    var rPrivate = el("input", { type: "radio", name: "vis", value: "private",
                                 id: "vis-private" });
    var rPublic = el("input", { type: "radio", name: "vis", value: "public",
                                id: "vis-public" });
    if (vis === "public") { rPublic.checked = true; } else { rPrivate.checked = true; }

    var fileInput = el("input", {
      type: "file", multiple: "multiple",
      accept: ".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain"
    });
    var picked = el("div", { class: "picked" });

    fileInput.onchange = function () {
      clear(picked);
      var files = Array.prototype.slice.call(fileInput.files || []);
      var over = files.filter(function (f) {
        return f.size > LIMITS.max_note_attachment_mb * 1048576;
      });
      if (files.length > LIMITS.max_note_attachments) {
        picked.appendChild(el("div", { class: "alert warn", text:
          "한 번에 최대 " + LIMITS.max_note_attachments + "개까지 올릴 수 있습니다. "
          + "(선택 " + files.length + "개)" }));
      }
      /* 서버도 검사하지만, 올리기 전에 알려주는 게 낫다. (전송 후 413 을 받으면
         기다린 시간이 아깝고 회선도 낭비된다) */
      if (over.length) {
        picked.appendChild(el("div", { class: "alert warn", text:
          "다음 파일은 " + LIMITS.max_note_attachment_mb + "MB 를 넘어 저장되지 않습니다: "
          + over.map(function (f) { return f.name; }).join(", ") }));
      }
      files.forEach(function (f) {
        picked.appendChild(el("div", { text: f.name + " (" + bytes(f.size) + ")" }));
      });
    };

    viewBox.appendChild(el("div", { class: "note-head" }, [
      backButton(),
      el("h2", { text: isNew ? "새 메모" : "메모 수정" })
    ]));

    viewBox.appendChild(el("div", { class: "form-field" },
      [el("label", { for: "note-title", text: "제목" }), title]));
    title.id = "note-title";

    viewBox.appendChild(el("div", { class: "form-field" },
      [el("label", { for: "note-content", text: "내용" }), content]));
    content.id = "note-content";

    viewBox.appendChild(el("div", { class: "form-field" }, [
      el("label", { text: "공개 범위" }),
      el("div", { class: "radios" }, [
        el("label", { for: "vis-private" },
          [rPrivate, visIcon(false), "나만 보기"]),
        el("label", { for: "vis-public" },
          [rPublic, visIcon(true), "전체 공유"])
      ])
    ]));

    viewBox.appendChild(el("div", { class: "form-field" }, [
      el("label", { text: "첨부파일 추가" }),
      fileInput,
      el("div", { class: "muted", style: "font-size:12px;margin-top:6px", text:
        "최대 " + LIMITS.max_note_attachments + "개, 파일당 "
        + LIMITS.max_note_attachment_mb + "MB · "
        + LIMITS.allowed_ext.join(", ") }),
      picked
    ]));

    /* 수정일 때는 기존 첨부를 여기서 지울 수 있다 */
    if (!isNew && n.attachments && n.attachments.length) {
      viewBox.appendChild(el("div", { class: "form-field" }, [
        el("label", { text: "기존 첨부파일" }),
        el("div", { class: "att-list" },
          n.attachments.map(function (a) { return attachmentNode(a, true); }))
      ]));
    }

    var save = el("button", { class: "btn primary", type: "button",
                              text: isNew ? "저장" : "변경 저장" });
    var cancel = el("button", { class: "btn", type: "button", text: "취소",
      onclick: function () {
        state.editing = false;
        if (isNew) { state.current = null; state.comments = []; renderView(); showDetail(false); }
        else { renderView(); }
      } });

    save.onclick = function () {
      var t = title.value.trim();
      if (!t) { notify("제목을 입력해 주세요.", "error"); title.focus(); return; }

      var files = Array.prototype.slice.call(fileInput.files || []);
      if (files.length > LIMITS.max_note_attachments) {
        notify("첨부파일은 한 번에 최대 " + LIMITS.max_note_attachments + "개까지입니다.",
               "error");
        return;
      }
      var tooBig = files.filter(function (f) {
        return f.size > LIMITS.max_note_attachment_mb * 1048576;
      });
      if (tooBig.length) {
        notify("파일당 최대 " + LIMITS.max_note_attachment_mb + "MB 입니다: "
               + tooBig.map(function (f) { return f.name; }).join(", "), "error");
        return;
      }

      var visValue = rPublic.checked ? "public" : "private";
      var body;
      if (files.length) {
        body = new FormData();
        body.append("title", t);
        body.append("content", content.value);
        body.append("visibility", visValue);
        files.forEach(function (f) { body.append("files", f); });
      } else {
        body = { title: t, content: content.value, visibility: visValue };
      }

      save.disabled = true;
      cancel.disabled = true;
      var req = isNew ? api("POST", "/api/notes", body)
                      : api("PATCH", "/api/notes/" + n.id, body);
      req.then(function (d) {
        state.current = d.note;
        state.editing = false;
        notify(isNew ? "메모를 저장했습니다." : "메모를 수정했습니다.");
        renderView();
        return loadList(true);
      }).catch(function (e) {
        notify(e.message, "error");
      }).then(function () {
        save.disabled = false;
        cancel.disabled = false;
      });
    };

    viewBox.appendChild(el("div", { class: "form-actions" }, [save, cancel]));
    title.focus();
  }

  /* ------------------------------------------------------------ 삭제 */
  function removeNote(n) {
    confirmBox({
      title: "메모를 삭제할까요?",
      message: "\"" + (n.title || "(제목 없음)") + "\" 과 첨부파일이 함께 삭제됩니다. "
               + "되돌릴 수 없습니다.",
      confirmText: "삭제", danger: true
    }).then(function (yes) {
      if (!yes) { return null; }
      return api("DELETE", "/api/notes/" + n.id).then(function () {
        notify("메모를 삭제했습니다.");
        state.current = null; state.comments = [];
        state.editing = false;
        renderView();
        showDetail(false);
        return loadList();
      }).catch(function (e) { notify(e.message, "error"); });
    });
  }

  function removeAttachment(a) {
    confirmBox({
      title: "첨부파일을 삭제할까요?",
      message: a.original_name + " 을 삭제합니다. 되돌릴 수 없습니다.",
      confirmText: "삭제", danger: true
    }).then(function (yes) {
      if (!yes) { return null; }
      return api("DELETE", "/api/note-attachments/" + a.id).then(function () {
        notify("첨부파일을 삭제했습니다.");
        return api("GET", "/api/notes/" + state.current.id).then(function (d) {
          state.current = d.note;
          if (state.editing) { renderForm(d.note); } else { renderView(); }
          return loadList(true);
        });
      }).catch(function (e) { notify(e.message, "error"); });
    });
  }

  /* ------------------------------------------------------------ 이벤트 */
  document.getElementById("new-btn").onclick = function () {
    state.current = null; state.comments = [];
    state.editing = true;
    renderList();
    renderForm(null);
  };

  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) {
    c.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (o) {
        o.classList.remove("active");
      });
      c.classList.add("active");
      state.scope = c.dataset.scope;
      loadList(true).catch(function (e) { notify(e.message, "error"); });
    };
  });

  var searchTimer = null;
  searchInput.oninput = function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = searchInput.value.trim();
      loadList(true).catch(function (e) { notify(e.message, "error"); });
    }, 250);
  };

  /* -------------------------------------------------------------- 시작 */
  renderView();
  loadList().catch(function (e) {
    clear(listBox);
    listBox.appendChild(el("div", { class: "alert error", text: e.message }));
  });
})();
</script>
</body>
</html>
